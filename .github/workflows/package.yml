name: Package c3addon

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read addon metadata
        id: meta
        run: |
          echo "id=$(jq -r '.id' addon.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' addon.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r '.name' addon.json)" >> "$GITHUB_OUTPUT"

      - name: Package addon
        run: |
          mkdir -p dist
          pkg="dist/${{ steps.meta.outputs.id }}-${{ steps.meta.outputs.version }}.c3addon"
          # Zip exactly what addon.json declares, at the archive root, so the
          # package can never drift from the file list.
          jq -r '.["file-list"][]' addon.json | zip -X -D -q "$pkg" -@
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: Verify package
        run: |
          unzip -l "$PKG"
          for f in $(jq -r '.["file-list"][]' addon.json); do
            unzip -p "$PKG" "$f" > /dev/null || { echo "::error::$f missing from package"; exit 1; }
          done
          # every effect parameter needs a display string
          unzip -p "$PKG" lang/en-US.json > /tmp/lang.json
          missing=$(jq -r --slurpfile lang /tmp/lang.json \
            '[.parameters[].id] - ($lang[0].text.effects[.id].parameters | keys) | .[]' addon.json)
          if [ -n "$missing" ]; then
            echo "::error::parameters missing en-US strings: $missing"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: c3addon
          path: dist/*.c3addon

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$PKG" \
            --title "${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}" \
            --generate-notes
